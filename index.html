<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الموظفين - العرض</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 20px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 20px; }
        
        .search-area { margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #searchInput { width: 100%; max-width: 500px; padding: 12px 20px; border: 2px solid #dfe1e5; border-radius: 25px; font-size: 16px; outline: none; transition: 0.3s; }
        #searchInput:focus { border-color: #1a73e8; box-shadow: 0 1px 6px rgba(32,33,36,0.28); }

        .actions { display: flex; justify-content: space-between; width: 100%; max-width: 600px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; color: white; font-weight: bold; transition: 0.3s; }
        .btn-add { background-color: #34a853; }
        .btn-refresh { background-color: #1a73e8; }
        .btn:hover { opacity: 0.85; transform: translateY(-1px); }

        .table-container { overflow-x: auto; margin-top: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #eee; }
        th { background-color: #1a73e8; color: white; font-weight: 600; }
        tr:hover { background-color: #f8f9fa; }
        
        .loading { text-align: center; padding: 40px; color: #5f6368; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 لوحة بيانات الموظفين</h2>
    
    <div class="search-area">
        <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="🔍 ابحث بالاسم أو رقم الموظف...">
        <div class="actions">
            <button class="btn btn-refresh" onclick="fetchData()">تحديث البيانات 🔄</button>
            <a href="add-employee.html" class="btn btn-add">➕ إضافة موظف</a>
        </div>
    </div>

    <div id="status" class="loading">جاري الاتصال بقاعدة البيانات...</div>
    
    <div class="table-container">
        <table id="myTable" style="display:none;">
            <thead id="tableHeader"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const apiUrl = 'https://script.google.com/macros/s/AKfycbDv7kIcIb1CJcmJZOtMHarBnfDzMEJcdKOePH-Xu2d9cY0FDXOMf0onJdyGUxk1OhvEg/exec';

    async function fetchData() {
        const status = document.getElementById('status');
        const table = document.getElementById('myTable');
        status.style.display = 'block';
        status.innerText = "جاري جلب أحدث البيانات...";
        table.style.display = 'none';

        try {
            // استخدام كسر الكاش لضمان جلب بيانات جديدة
            const response = await fetch(apiUrl + '?nocache=' + new Date().getTime());
            const data = await response.json();

            if (!data || data.length === 0) {
                status.innerText = "الجدول فارغ حالياً، قم بإضافة موظفين.";
                return;
            }

            renderTable(data);
            status.style.display = 'none';
            table.style.display = 'table';
        } catch (error) {
            status.innerText = "❌ فشل الاتصال. تأكد من إعدادات النشر في Google Script.";
            console.error("Error:", error);
        }
    }

    function renderTable(data) {
        const header = document.getElementById('tableHeader');
        const body = document.getElementById('tableBody');
        header.innerHTML = ""; body.innerHTML = "";

        // إنشاء العناوين تلقائياً من أول كائن
        const keys = Object.keys(data[0]);
        let hRow = "<tr>";
        keys.forEach(k => hRow += `<th>${k}</th>`);
        header.innerHTML = hRow + "</tr>";

        // تعبئة الصفوف
        data.forEach(item => {
            let row = document.createElement('tr');
            keys.forEach(k => {
                let cell = document.createElement('td');
                cell.innerText = item[k] || "-";
                row.appendChild(cell);
            });
            body.appendChild(row);
        });
    }

    function searchTable() {
        let val = document.getElementById("searchInput").value.toLowerCase();
        let rows = document.getElementById("tableBody").getElementsByTagName("tr");
        for (let r of rows) {
            r.style.display = r.textContent.toLowerCase().includes(val) ? "": "none";
        }
    }

    window.onload = fetchData;
</script>
</body>
</html>
