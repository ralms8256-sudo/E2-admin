<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة موظف جديد</title>
    <style>
        body { font-family: 'Segoe UI', Arial; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 650px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #34a853; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <h2>➕ إضافة موظف جديد</h2>
    <form id="addForm">
        <div class="grid">
            <div><label>رقم الموظف</label><input type="text" name="EmployeeID" required></div>
            <div><label>السجل المدني</label><input type="text" name="NationalID" required></div>
            <div><label>رقم الراتب</label><input type="text" name="SalaryID" required></div>
            <div><label>الاسم الكامل</label><input type="text" name="Name" required></div>
            <div><label>المسمى الوظيفي</label><input type="text" name="JobTitle" required></div>
            <div><label>القسم</label><input type="text" name="Department" required></div>
            <div><label>المؤهل</label><input type="text" name="Qualification" required></div>
            <div><label>الجنسية</label><input type="text" name="Nationality" required></div>
            <div><label>الجنس</label>
                <select name="Gender">
                    <option value="ذكر">ذكر</option>
                    <option value="أنثى">أنثى</option>
                </select>
            </div>
            <div><label>ملاك الوظيفة</label><input type="text" name="Malak" required></div>
        </div>
        <div style="margin-top:10px;"><label>الإيميل</label><input type="email" name="Email" required></div>
        <div style="margin-top:10px;"><label>الهاتف</label><input type="text" name="Phone" required></div>
        <button type="submit" id="btn">حفظ البيانات</button>
    </form>
    <a href="index.html" style="display:block; text-align:center; margin-top:15px; color:#1a73e8; text-decoration:none;">🔙 العودة للجدول</a>
</div>

<script>
    const apiUrl = 'https://script.google.com/macros/s/AKfycby5ZYjpfZrrXZDa2-NjPyPud_JyjsTk3eQCTZ5-7Kldx9Ce5gY58cDKDXrE7SAnFHdIGQ/exec';
    document.getElementById('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const b = document.getElementById('btn');
        b.innerText = "جاري التحقق من السجل المدني..."; b.disabled = true;
        const formData = Object.fromEntries(new FormData(e.target).entries());
        try {
            const response = await fetch(apiUrl, { method: 'POST', body: JSON.stringify({ action: "add", data: formData }) });
            const result = await response.text();
            if (result.includes("Error")) {
                alert("⚠️ عذراً، رقم السجل المدني هذا مسجل مسبقاً لموظف آخر!");
            } else {
                alert("✅ تم الحفظ بنجاح!"); e.target.reset();
            }
        } catch (e) { alert("❌ خطأ في الاتصال"); }
        b.innerText = "حفظ البيانات"; b.disabled = false;
    });
</script>
</body>
</html>
